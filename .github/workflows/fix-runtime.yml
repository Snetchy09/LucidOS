name: Fix Lucid Runtime
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore and fix runtime
        run: python3 scripts/fix-lucid-runtime.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/lucid-script-runtime.js
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Lucid Script parser: property blocks, game/window expressions, ASI"
            git push
          fi
