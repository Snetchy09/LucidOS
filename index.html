<!DOCTYPE html>
<html>
<head>
    <title>LucidOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: #3f4652;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #desktop {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #20242b;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        #start-button {
            height: 36px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            background-color: #3a404a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #start-button:hover {
            background-color: #4a5260;
        }

        #clock {
            margin-left: auto;
            color: white;
            font-size: 14px;
            padding-right: 10px;
        }
    </style>
</head>

<body>

    <div id="desktop">

        <div id="taskbar">
            <button id="start-button">LucidOS</button>

            <div id="clock">00:00</div>
        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");

            document.getElementById("clock").textContent =
                hours + ":" + minutes;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
