<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucidOS</title>
    <link rel="stylesheet" href="css/system.css">
    <link rel="stylesheet" href="css/lucid-additions.css">
</head>

<body>
    <div id="desktop">
        <div id="lucid-atmosphere"></div>
        <div id="desktop-apps" aria-label="Desktop applications"></div>

        <button id="start-button" aria-label="Open Lucid launcher">
            <span class="lucid-center">
                <span class="lucid-orb">
                    <span class="lucid-orb-eye"></span>
                </span>
            </span>
        </button>

        <div id="start-menu" aria-hidden="true"></div>
        <div id="taskbar">
            <div id="taskbar-apps"></div>
            <div id="clock">00:00</div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
