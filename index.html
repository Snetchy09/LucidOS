<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LucidOS</title>

    <link rel="stylesheet" href="css/system.css">
</head>

<body>

    <div id="desktop">

        <!-- START MENU -->

        <div id="start-menu">

            <h2>LucidOS</h2>

            <button
                class="app-button"
                id="files-button"
            >
                📁 Files
            </button>

            <button
                class="app-button"
                id="editor-button"
            >
                📝 Text Editor
            </button>

            <button class="app-button">
                🌐 Browser
            </button>

            <button class="app-button">
                💬 LucidChat
            </button>

            <button
                class="app-button"
                id="terminal-button"
            >
                🖥️ Terminal
            </button>

            <button class="app-button">
                ⚙️ Settings
            </button>

        </div>


        <!-- TASKBAR -->

        <div id="taskbar">

            <button id="start-button">
                LucidOS
            </button>

            <div id="taskbar-apps"></div>

            <div id="clock">
                00:00
            </div>

        </div>

    </div>


    <!-- MAIN PROGRAM -->

    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
